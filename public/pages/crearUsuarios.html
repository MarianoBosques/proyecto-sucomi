<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
  <title>Sucomi - Crear Usuario</title>
  <link rel="stylesheet" href="../css/crearUsuarios.css">
  <link rel="shortcut icon" href="assets/images/IconoSucomiWeb.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <h1>Formulario de crear usuarios para el sistema</h1>
  <br />
  <br />

  <div class="form-container">
        <h2>Registro de Usuario</h2>
        <form id="userForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ingrese su nombre completo">
                <div class="error" id="nombreError">Este campo es obligatorio</div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="Ingrese su correo electrónico">
                <div class="error" id="emailError">Este campo es obligatorio</div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña">
                <div class="error" id="passwordError">Este campo es obligatorio</div>
            </div>

            <div class="form-group">
                <label>Cargo</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="mesero" name="cargo" value="mesero" checked>
                        <label for="mesero">Mesero</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="chef" name="cargo" value="chef">
                        <label for="chef">Chef</label>
                    </div>
                </div>
                <div class="error" id="cargoError">Debe seleccionar un cargo</div>
            </div>

            <button type="button" id="registrarBtn">Registrar Usuario</button>
            <div id="formMessage" class="form-message"></div> </form>
    </div>

  <br />
  <br />

  <script type="module" src="../javascript/crearUsuarios.js"></script>

</body>
</html>
