<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reestablecer Contraseña</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="assets/images/IconoSucomiWeb.png" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/restauration.css">
</head>
<body> 
    <h1>Sucomi</h1>
    <br />
    <div class="password-reset-container">
        <div class="password-reset-card">
            <h2><i class="fas fa-key"></i> Reestablecer Contraseña</h2>
            
            <form id="resetPasswordForm">

                <!--
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Correo Electrónico
                    </label>
                    <input type="email" id="email" name="email" required placeholder="Ingresa tu correo electrónico">
                </div>-->

                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-lock"></i> Nueva Contraseña
                    </label>
                    <div class="input-with-icon">
                        <input type="password" id="newPassword" name="newPassword" required placeholder="Mínimo 6 caracteres">
                        <i class="fas fa-eye toggle-password" id="toggleNewPassword"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirmar Contraseña
                    </label>
                    <div class="input-with-icon">
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repite la contraseña">
                        <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn cancel-btn" onclick="cancelReset()">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn submit-btn">
                        <i class="fas fa-check"></i> Aceptar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Éxito -->
    <div id="successModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <i class="fas fa-check-circle success-icon"></i>
            <h3>¡Contraseña Actualizada!</h3>
            <p>Se ha cambiado la contraseña exitosamente.</p>
            <button id="continueBtn" class="btn submit-btn">Continuar</button>
        </div>
    </div>

    <!-- Vinculamos el archivo JS externo como un módulo -->
    <script type="module" src="../javascript/restauration.js"></script>
</body>
</html>
