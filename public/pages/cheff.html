<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Chef - SUCOMI</title>
    <!-- Añadido Font Awesome para los iconos -->
    <link rel="shortcut icon" href="assets/images/IconoSucomiWeb.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/chef.css">
</head>
<body>

    <header id="main-header">
        <div class="header-content">
            <img src="../assets/images/LogoSucomi1.png" alt="Logo de SUCOMI" class="header-logo">
            <img id="restaurant-logo" class="restaurant-logo" style="display: none;">
            <h1 id="header-text">SUCOMI</h1>
        </div>
        <div class="user-menu" id="userMenu">
            <i class="fas fa-user-circle user-icon" id="userIcon"></i>
            <div class="user-submenu" id="userSubmenu">
                <div class="user-info">
                    <p>¡Hola, <strong><span id="userName">Cargando...</span></strong>!</p>
                    <p><span id="userEmail">Cargando...</span></p>
                </div>
                <button class="submenu-button" id="configButton">
                    <i class="fas fa-cog"></i> Configuración
                </button>
                <button class="submenu-button" id="logoutButton">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <main>
        <h2>Órdenes Pendientes</h2>

        <div id="chefOrdersList" class="chef-orders-container">
            <p class="no-pending-orders-message">No hay órdenes pendientes en este momento.</p>
        </div>
    </main>

    <!-- 💡 NUEVO: Estructura del Modal Personalizado (copiada de mesero.html) -->
    <div id="customModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modalTitle">Título del Modal</h3>
            <p id="modalMessage">Este es el mensaje del modal.</p>
            <input type="text" id="modalInput" style="display: none;" placeholder="Escribe aquí...">
            <div class="modal-buttons">
                <button id="modalBtnConfirm" class="modal-btn modal-btn-confirm">Confirmar</button>
                <button id="modalBtnCancel" class="modal-btn modal-btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Diálogo de confirmación para cerrar sesión -->
    <div class="confirm-dialog-overlay" id="confirmLogoutDialog">
        <div class="confirm-dialog">
            <p>¿Deseas salir?</p>
            <div class="confirm-buttons">
                <button id="confirmLogoutYes">Sí</button>
                <button id="confirmLogoutNo">No</button>
            </div>
        </div>
    </div>

    <script type="module" src="../javascript/chef.js"></script>
</body>
</html>
