<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil de usuario</title>
  <!-- Añadido Font Awesome para los iconos -->
  <link rel="shortcut icon" href="assets/images/IconoSucomiWeb.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
  <div class="container">
    <!-- Menú lateral -->
    <aside class="sidebar">
      <button><i class="fas fa-cog"></i> Configuración</button>
      <button onclick="volverInicio()"><i class="fas fa-arrow-left"></i> Volver</button>
      <button onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
    </aside>
  
    <main class="main-content">
      <!-- Vista de Editar Perfil -->
      <section id="perfil-section">
        <h1>Configuración de Perfil</h1>

        <div class="form-group">
          <i class="fas fa-user-circle"></i>
          <div class="input-wrapper">
            <label for="usernameDisplay">Nombre de Usuario Actual</label>
            <span id="usernameDisplay">Cargando...</span>
          </div>
        </div>

        <div class="form-group">
          <i class="fas fa-user"></i>
          <div class="input-wrapper">
            <label for="usernameInput">Editar Nombre de Usuario</label> 
            <input type="text" id="usernameInput" maxlength="32" value="" placeholder="Tu nuevo nombre de usuario" />
          </div>
        </div>
        <button class="config-btn" onclick="irARestaurarContrasena()"><i class="fas fa-key"></i> Cambiar contraseña</button>       
        <button class="guardar-btn" onclick="guardarPerfil()">Guardar</button>
      </section>
    </main>
  </div>

  <!-- Modal Personalizado para Confirmaciones -->
  <div id="customModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <p id="modalMessage"></p>
        <div class="modal-buttons">
            <button id="modalBtnConfirm" class="modal-btn modal-btn-confirm"></button>
            <button id="modalBtnCancel" class="modal-btn modal-btn-cancel"></button>
        </div>
    </div>
  </div>

  <script type="module" src="../javascript/perfil.js"></script>
</body>
</html>
