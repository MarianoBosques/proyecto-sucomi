<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="shortcut icon" href="assets/images/IconoSucomiWeb.png" />
    <link rel="stylesheet" href="/css/waiterLogin.css">
</head>
<body>
    <h1>Bienvenido Mesero</h1>

    <div class="login-container">
        <form id="loginForm" class="login-form">
            <h2>Iniciar Sesión como Mesero</h2>
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                <div class="error-message" id="usernameError"></div>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                <div class="error-message" id="passwordError"></div>
            </div>
            <input type="submit" value="Entrar" class="btn solid">
            <div id="formMessage" class="form-message"></div>
        </form>
    </div>
    <script type="module" src="./javascript/waiterLogin.js"></script>
</body>
</html>
