<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUCOMI</title>
    <link rel="shortcut icon" href="assets/images/IconoSucomiWeb.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/principal.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>SUCOMI</h1>
        </div>
        <div class="user-menu" id="userMenu">
            <i class="fas fa-user-circle user-icon" id="userIcon"></i>
            <div class="user-submenu" id="userSubmenu">
                <div class="user-info">
                    <p>¡Hola, <strong><span id="userName">Cargando...</span></strong>!</p>
                    <p><span id="userEmail">Cargando...</span></p>
                </div>
                <button class="submenu-button" id="configButton">
                    <i class="fas fa-cog"></i> Configuración
                </button>
                <button class="submenu-button" id="logoutButton">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <a href="/adminLogin.html" class="button administrador">Administrador</a>
        <a href="/waiterLogin.html" class="button mesero">Mesero</a>
        <a href="/chefLogin.html" class="button cheff">Chef</a>
    </div>

    <div class="confirm-dialog-overlay" id="confirmLogoutDialog">
        <div class="confirm-dialog">
            <p>¿Deseas salir?</p>
            <div class="confirm-buttons">
                <button id="confirmLogoutYes">Sí</button>
                <button id="confirmLogoutNo">No</button>
            </div>
        </div>
    </div>
    <script type="module" src="./javascript/principal.js"></script>
</body>
</html>
